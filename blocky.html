<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Red Riding Hood: model viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2418; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; color: #ece8df; }
  #view { position: fixed; inset: 0 280px 0 0; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 280px; box-sizing: border-box; padding: 14px 16px; overflow-y: auto; background: rgba(20,24,20,0.96); border-left: 1px solid #34402f; font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #a4b09a; margin: 16px 0 6px; border-bottom: 1px solid #34402f; padding-bottom: 3px; }
  .sub { color: #8f9a86; font-size: 11px; line-height: 1.5; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; }
  button { background: #2c3628; color: #ece8df; border: 1px solid #4a5a42; border-radius: 4px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
  button:hover { background: #38452f; } button.on { background: #7a2a2a; border-color: #e8b83a; color: #fff; }
  .skin { margin-top: 6px; } .skin canvas { width: 192px; height: 192px; image-rendering: pixelated; background: #222 repeating-conic-gradient(#2a2a30 0 25%, #1e1e24 0 50%) 0 0/16px 16px; border: 1px solid #4a5a42; display: block; }
  a { color: #e8b83a; }
  @media (max-width: 700px) { #view { right: 0; bottom: 230px; } #panel { top: auto; width: 100%; height: 230px; border-left: 0; border-top: 1px solid #34402f; } }
</style>
</head>
<body>
<div id="view"></div>
<aside id="panel">
  <h1>Little Red Riding Hood</h1>
  <div class="sub">The hero model, built on the blocky rig. Drag to orbit, scroll to zoom, right-drag to pan.</div>
  <h3>Face</h3><div class="btns" id="faces"></div>
  <h3>Cloak</h3><div class="btns" id="cloak"></div>
  <h3>Pose</h3><div class="btns" id="pose"></div>
  <h3>Carrying</h3><div class="btns" id="carry"></div>
  <h3>Walk</h3><div class="btns" id="walk"></div>
  <h3>View</h3><div class="btns"><button id="spin">Turntable</button><button id="home">Reset camera</button><button id="face">Face close-up</button><button id="back">From behind</button></div>
  <h3>Skin</h3><div class="sub">64×64, Minecraft-style layout with 3×3 arms. The cloak, hood, plaits and basket are separate models.</div>
  <div class="skin" id="skin"></div>
  <p class="sub"><a href="index.html">Play the sandbox →</a></p>
</aside>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/voxel.js"></script>
<script src="js/blocky.js"></script>
<script>
(function () {
  var B = window.Blocky, view = document.getElementById('view');
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  view.appendChild(renderer.domElement);
  var scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fb8d8); scene.fog = new THREE.Fog(0x8fb8d8, 160, 320);
  var camera = new THREE.PerspectiveCamera(34, 1, 1, 600);
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.minDistance = 20; controls.maxDistance = 260; controls.maxPolarAngle = Math.PI * 0.49;
  function look(px, py, pz, tx, ty, tz) { camera.position.set(px, py, pz); controls.target.set(tx, ty, tz); }
  function home() { look(34, 30, 78, 0, 17, 0); }
  home();
  scene.add(new THREE.HemisphereLight(0xdfeaff, 0x4a5a38, 0.75));
  var sun = new THREE.DirectionalLight(0xfff0d8, 0.7); sun.position.set(40, 80, 60); scene.add(sun);

  var fc = document.createElement('canvas'); fc.width = fc.height = 16; var fx = fc.getContext('2d');
  window.Voxel.noise(fx, '#5f8f3a', ['#6aa044', '#538030', '#78b050', '#4a7a2c'], 1, 0.5);
  var ft = new THREE.CanvasTexture(fc); ft.magFilter = THREE.NearestFilter; ft.wrapS = ft.wrapT = THREE.RepeatWrapping; ft.repeat.set(32, 32); ft.encoding = THREE.sRGBEncoding;
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(256, 256), new THREE.MeshLambertMaterial({ map: ft })); floor.rotation.x = -Math.PI / 2; scene.add(floor);

  var red = B.makeRed(); red.root.scale.setScalar(0.95); scene.add(red.root);
  var basket = B.makeBasket();
  var stool = new THREE.Mesh(new THREE.BoxGeometry(12, 4, 10), new THREE.MeshLambertMaterial({ color: new THREE.Color(0x5a4028).convertSRGBToLinear() })); stool.position.set(0, 2, 1); stool.visible = false; scene.add(stool);

  function group(id, items, onpick, first) {
    var box = document.getElementById(id);
    items.forEach(function (it, i) {
      var b = document.createElement('button'); b.textContent = it[0]; b.className = i === first ? 'on' : '';
      b.onclick = function () { onpick(it[1]); box.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); };
      box.appendChild(b);
    });
  }
  group('faces', B.EXPRESSIONS.map(function (e) { return [e, e]; }), function (e) { red.setExpr(e); drawSkin(); }, 0);
  group('cloak', [['Cloak on, hood down', 0], ['Cloak on, hood up', 1], ['Cloak off', 2]], function (v) { if (v === 2) red.setCloak(false); else { red.setCloak(true); red.setHood(v === 1); } }, 0);
  group('pose', [['Standing', 'stand'], ['Sitting', 'sit']], function (p) { B.setPose(red, p); stool.visible = p === 'sit'; if (p === 'sit') setTimeout(function () { B.seatFeet(red, 0); }, 600); }, 0);
  group('carry', [['Empty-handed', 0], ['Basket', 1]], function (v) { red.hold(v ? basket : null); }, 0);
  var walking = false; group('walk', [['Stand still', 0], ['Walk', 1], ['Run', 2]], function (v) { walking = v; }, 0);
  document.getElementById('spin').onclick = function () { controls.autoRotate = !controls.autoRotate; this.classList.toggle('on', controls.autoRotate); };
  document.getElementById('home').onclick = home;
  document.getElementById('face').onclick = function () { look(14, 33, 30, 0, 27, 0); };
  document.getElementById('back').onclick = function () { look(-30, 30, -76, 0, 17, 0); };

  function drawSkin() { var h = document.getElementById('skin'); h.innerHTML = ''; var c = document.createElement('canvas'); c.width = c.height = 64; c.getContext('2d').drawImage(red.skin.canvas, 0, 0); h.appendChild(c); }
  drawSkin();

  function resize() { var w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  window.addEventListener('resize', resize); resize();
  var last = performance.now();
  (function loop(t) {
    var dt = Math.min(0.05, (t - last) / 1000); last = t;
    var m = red.motion; m.speed = walking === 2 ? 50 : walking === 1 ? 26 : 0; m.phase += dt * m.speed * 0.42 * 0.8 * 0.95;
    B.step(red, dt); controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
  })(last);
  window.__blocky = { red: red, camera: camera, controls: controls, look: look, scene: scene };
})();
</script>
</body>
</html>

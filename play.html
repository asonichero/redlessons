<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>About the Cottage</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a0f10">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1416; font-family: Georgia, 'Times New Roman', serif; color: #f3ead8; touch-action: none; }
  #view { position: fixed; inset: 0; }
  #card { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 40px)); background: #f6ecd8; color: #3a2a20; border: 3px solid #6b4a32; border-radius: 16px; padding: 18px 22px; font: 17px/1.5 Georgia, serif; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.45); z-index: 30; }
  #card .go, #card button { display: inline-block; margin: 6px; padding: 8px 18px; border-radius: 10px; border: 2px solid #6b4a32; background: #8a2a2a; color: #fff; font: 16px Georgia, serif; text-decoration: none; cursor: pointer; }
  #card button { background: #fffaf0; color: #3a2a20; }
</style>
</head>
<body>
<div id="view"></div>
<div id="clothes"><div class="row"><label>Her skirt</label><div class="tabs"><button data-skirt="down">On</button><button data-skirt="up">Lifted</button><button data-skirt="off">Off</button></div></div>
  <div class="row"><label>Her cloak</label><div class="tabs"><button data-outfit="No cloak">None</button><button data-outfit="Hood down">Hood down</button><button data-outfit="Hood up">Hood up</button></div></div></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/toon.js"></script>
<script src="js/looks.js"></script>
<script src="js/cottage.js"></script>
<script src="js/stage.js"></script>
<script src="js/motion.js"></script>
<script src="js/audio.js"></script>
<script src="js/talk.js"></script>
<script src="js/story.js"></script>
<script src="js/play.js"></script>
<script src="js/hud.js"></script>
<script>
// At the end of the homecoming conversation her mother has told her to come here: a card leads on to the lap scene.
const P = window.__play = Play.create(document.getElementById('view'), { after: scene => {
  if (scene !== 'homecoming') return;
  const c = document.createElement('div'); c.id = 'card'; c.innerHTML = '<p>Little Red slips off her cloak, lays it over the back of the chair, and goes to her mother.</p><a class="go" href="lap.html?scene=homecoming">Go to her</a> <button id="stay">Not yet</button>';
  document.body.appendChild(c); document.getElementById('stay').onclick = () => c.remove();
} });
// The controls and the menu (js/hud.js); her clothes are in the menu (and K steps through the skirt).
const hud = Hud.create({ get: () => P, extra: document.getElementById('clothes'), extraTitle: 'Her clothes',
  links: [{ label: 'Chapter one', href: 'story.html' }, { label: 'Over the knee', href: 'lap.html' }, { label: 'Character editor', href: 'editor.html' }] });
hud.objective('About the cottage: walk her round, and try things.'); setTimeout(() => hud.objective(''), 6000);
// Her skirt: on, lifted (gathered at her waist) or off, to see how she moves under it. Remembered in this browser.
const SKIRTS = ['down', 'up', 'off'], skirtBtns = [...document.querySelectorAll('[data-skirt]')];
let skirt = 'down'; try { skirt = localStorage.getItem('red-lessons:play-skirt') || 'down'; } catch (e) {}
function setSkirt(k) { skirt = SKIRTS.includes(k) ? k : 'down'; P.setDress({ skirt }); skirtBtns.forEach(b => b.classList.toggle('on', b.dataset.skirt === skirt)); try { localStorage.setItem('red-lessons:play-skirt', skirt); } catch (e) {} }
skirtBtns.forEach(b => b.addEventListener('click', () => setSkirt(b.dataset.skirt)));
addEventListener('keydown', e => { if (e.code === 'KeyK' && !e.repeat) setSkirt(SKIRTS[(SKIRTS.indexOf(skirt) + 1) % 3]); });
setSkirt(skirt);
// Her cloak: none, hood down or hood up (kept with her looks, so the editor and the lap scene wear the same).
const outfitBtns = [...document.querySelectorAll('[data-outfit]')];
const showOutfit = () => outfitBtns.forEach(b => b.classList.toggle('on', b.dataset.outfit === P.outfit));
outfitBtns.forEach(b => b.addEventListener('click', () => { P.setOutfit(b.dataset.outfit); showOutfit(); }));
showOutfit();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>

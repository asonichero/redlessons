<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Editor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1416; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; color: #e8e6e3; }
  #view { position: fixed; inset: 0 320px 0 0; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 320px; box-sizing: border-box; padding: 14px 16px; overflow-y: auto; background: rgba(22,18,20,0.97); border-left: 1px solid #3a2c30; font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 4px; } .sub { color: #9a8a8e; font-size: 11px; line-height: 1.5; }
  h2 { font-size: 14px; margin: 16px 0 2px; color: #c9a84c; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #a8969a; margin: 10px 0 5px; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  button { background: #33282c; color: #e8e6e3; border: 1px solid #554449; border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  button:hover { background: #43343a; } button.on { background: #6b2a2a; border-color: #e07070; color: #fff; }
  .sw { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 2px solid #554449; }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px #c9a84c; }
  input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid #554449; border-radius: 4px; background: none; cursor: pointer; }
  a { color: #c9a84c; }
  #saved { color: #8fbf8f; font-size: 11px; margin-left: 6px; }
  @media (max-width: 700px) { #view { inset: 0 0 50% 0; } #panel { top: 50%; width: 100%; border-left: 0; border-top: 1px solid #3a2c30; } }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>Character editor</h1>
  <div class="sub">Jack and Gerda: what they wear, and their skin, hair and eyes. Changes are kept in this browser and used by <a href="lap.html">the lap scene</a>. Drag to orbit.</div>
  <div class="btns" style="margin-top:8px"><button data-view="front" class="on">Front</button><button data-view="side">Side</button><button data-view="back">Back</button><button id="spin">Turn</button></div>
  <div id="jack"></div>
  <h3>His face</h3>
  <div class="btns" id="faces"></div>
  <div id="gerda"></div>
  <div class="btns" style="margin-top:16px"><button id="reset">Back to their own colours</button><span id="saved"></span></div>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/blocky.js"></script>
<script src="js/looks.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id), B = Blocky, L = Looks, V3 = THREE.Vector3;
  let look = L.load(), face = 'grin', spin = false;

  // ── Stage: the two of them side by side on a plank floor. ──
  const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.outputEncoding = THREE.sRGBEncoding; renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); $('view').appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a1416);
  const camera = new THREE.PerspectiveCamera(32, 1, 1, 600), controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.minDistance = 20; controls.maxDistance = 200; controls.maxPolarAngle = Math.PI * 0.49;
  scene.add(new THREE.HemisphereLight(0xfff0e0, 0x30283a, 0.7)); const sun = new THREE.DirectionalLight(0xfff0d8, 0.55); sun.position.set(30, 70, 60); scene.add(sun);
  const fc = document.createElement('canvas'); fc.width = fc.height = 16; const fx = fc.getContext('2d');
  for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) { fx.fillStyle = ['#6a4a30', '#5e4028', '#745236'][(i * 7 + j * 13 + (j >> 2) * 5) % 3]; fx.fillRect(i, j, 1, 1); }
  const ft = new THREE.CanvasTexture(fc); ft.magFilter = ft.minFilter = THREE.NearestFilter; ft.wrapS = ft.wrapT = THREE.RepeatWrapping; ft.repeat.set(10, 10); ft.encoding = THREE.sRGBEncoding;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshLambertMaterial({ map: ft })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
  const turn = new THREE.Group(); scene.add(turn);
  const jack = B.makeJack(), gerda = B.makeGerda(look.gerda.outfit);
  jack.root.scale.setScalar(0.95); jack.root.position.x = -9; gerda.root.position.x = 9;     // (Jack at his size: 95% of the model's scale; Gerda at hers)
  turn.add(jack.root, gerda.root);
  const VIEWS = { front: [0, 22, 92], side: [92, 22, 0], back: [0, 22, -92] };
  const view = name => { camera.position.set(...VIEWS[name]); controls.target.set(0, 16, 0); controls.update(); document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === name)); };

  function paint() {
    L.paintJack(jack, look.jack, { expr: face });
    L.paintGerda(gerda, look.gerda);
  }
  let savedT = 0;
  function changed() { look = L.save(look); paint(); sync(); $('saved').textContent = 'Saved'; clearTimeout(savedT); savedT = setTimeout(() => $('saved').textContent = '', 1200); }

  // ── The panel: an outfit row and a colour row per feature, for each of them. ──
  const FEATURES = { jack: [['skin', 'Skin'], ['hair', 'Hair'], ['eyes', 'Eyes']], gerda: [['skin', 'Skin'], ['hair', 'Hair'], ['eyes', 'Eyes'], ['lips', 'Lips']] };
  const NAMES = { jack: 'Jack (21)', gerda: 'Gerda (late thirties)' };
  const syncers = [];
  for (const who of ['jack', 'gerda']) {
    const box = $(who); box.innerHTML = `<h2>${NAMES[who]}</h2><h3>Outfit</h3>`;
    const row = document.createElement('div'); row.className = 'btns'; box.appendChild(row);
    for (const o of L.OUTFITS[who]) { const b = document.createElement('button'); b.textContent = o; b.onclick = () => { look[who].outfit = o; changed(); }; row.appendChild(b); syncers.push(() => b.classList.toggle('on', look[who].outfit === o)); }
    for (const [k, name] of FEATURES[who]) {
      const h = document.createElement('h3'); h.textContent = name; box.appendChild(h);
      const r = document.createElement('div'); r.className = 'btns'; box.appendChild(r);
      for (const c of L.SWATCHES[k]) { const b = document.createElement('button'); b.className = 'sw'; b.style.background = c; b.title = c; b.onclick = () => { look[who][k] = c; changed(); }; r.appendChild(b); syncers.push(() => b.classList.toggle('on', look[who][k] === c)); }
      const pick = document.createElement('input'); pick.type = 'color'; pick.title = 'Any colour'; pick.oninput = () => { look[who][k] = pick.value; changed(); }; r.appendChild(pick);
      syncers.push(() => { pick.value = look[who][k]; });
    }
  }
  for (const f of ['grin', 'smile', 'shy', 'cheeky', 'squint', 'wince', 'gritted', 'crying']) {
    const b = document.createElement('button'); b.textContent = f; b.onclick = () => { face = f; paint(); sync(); }; $('faces').appendChild(b); syncers.push(() => b.classList.toggle('on', face === f));
  }
  const sync = () => syncers.forEach(f => f());
  $('reset').onclick = () => { look = L.reset(); paint(); sync(); };
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => view(b.dataset.view));
  $('spin').onclick = () => { spin = !spin; $('spin').classList.toggle('on', spin); if (!spin) turn.rotation.y = 0; };

  function resize() { const w = $('view').clientWidth, h = $('view').clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  let last = performance.now();
  (function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (spin) turn.rotation.y += dt * 0.6; B.step(jack, dt); B.step(gerda, dt); controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })(last);
  view('front'); paint(); sync();
})();
</script>
</body>
</html>

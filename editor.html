<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Editor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1416; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; color: #e8e6e3; }
  #view { position: fixed; inset: 0 320px 0 0; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 320px; box-sizing: border-box; padding: 14px 16px; overflow-y: auto; background: rgba(22,18,20,0.97); border-left: 1px solid #3a2c30; font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 4px; } .sub { color: #9a8a8e; font-size: 11px; line-height: 1.5; }
  h2 { font-size: 14px; margin: 16px 0 2px; color: #c9a84c; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #a8969a; margin: 10px 0 5px; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  button { background: #33282c; color: #e8e6e3; border: 1px solid #554449; border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  button:hover { background: #43343a; } button.on { background: #6b2a2a; border-color: #e07070; color: #fff; }
  .sw { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 2px solid #554449; }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px #c9a84c; }
  input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid #554449; border-radius: 4px; background: none; cursor: pointer; }
  a { color: #c9a84c; }
  #saved { color: #8fbf8f; font-size: 11px; margin-left: 6px; }
  @media (max-width: 700px) { #view { inset: 0 0 50% 0; } #panel { top: 50%; width: 100%; border-left: 0; border-top: 1px solid #3a2c30; } }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>Character editor</h1>
  <div class="sub">Red Riding Hood and Gerda: what they wear, and the colours of their skin, hair, eyes and lips. Changes are kept in this browser and used by <a href="lap.html">the lap scene</a>. Drag to orbit.</div>
  <div class="btns" style="margin-top:8px"><button data-view="front" class="on">Front</button><button data-view="side">Side</button><button data-view="back">Back</button><button data-view="faces">Faces</button><button id="spin">Turn</button></div>
  <div id="red"></div>
  <h3>Her face</h3>
  <div class="btns" id="faces"></div>
  <div id="gerda"></div>
  <div class="btns" style="margin-top:16px"><button id="reset">Back to their own colours</button><span id="saved"></span></div>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/toon.js"></script>
<script src="js/looks.js"></script>
<script src="js/stage.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id), L = Looks, V3 = THREE.Vector3;
  let look = L.load(), face = 'calm', spin = false, t = 0;
  const st = Stage.create($('view'), { fov: 30 });
  const turn = new THREE.Group(); st.scene.add(turn);
  const rigs = {}, X = { red: -9, gerda: 9 };
  // Each change rebuilds the character (it takes a moment, and keeps the code that builds them in one place).
  function build(who) {
    if (rigs[who]) turn.remove(rigs[who].root);
    const r = rigs[who] = Toon.make(who, look[who]); r.root.position.x = X[who]; r.root.rotation.y = who === 'red' ? 0.12 : -0.12; turn.add(r.root); st.cast(r);
    if (who === 'red') r.setExpr(face); else r.setExpr('calm');
  }
  const VIEWS = { front: [[0, 20, 88], [0, 15, 0]], side: [[88, 20, 0], [0, 15, 0]], back: [[0, 20, -88], [0, 15, 0]], faces: [[0, 27, 30], [0, 26.5, 0]] };
  const view = (name, ms) => { st.go(new V3(...VIEWS[name][0]), new V3(...VIEWS[name][1]), ms); document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === name)); };
  let savedT = 0;
  function changed(who) { look = L.save(look); build(who); sync(); $('saved').textContent = 'Saved'; clearTimeout(savedT); savedT = setTimeout(() => $('saved').textContent = '', 1200); }

  // The panel: an outfit row and a colour row per feature, for each of them.
  const FEATURES = { red: [['skin', 'Skin'], ['hair', 'Hair'], ['eyes', 'Eyes'], ['lips', 'Lips'], ['cloak', 'Cloak']], gerda: [['skin', 'Skin'], ['hair', 'Hair'], ['eyes', 'Eyes'], ['lips', 'Lips']] };
  const syncers = [];
  for (const who of ['red', 'gerda']) {
    const box = $(who); box.innerHTML = `<h2>${L.NAMES[who]}</h2><h3>Outfit</h3>`;
    const row = document.createElement('div'); row.className = 'btns'; box.appendChild(row);
    for (const o of L.OUTFITS[who]) { const b = document.createElement('button'); b.textContent = o; b.onclick = () => { look[who].outfit = o; changed(who); }; row.appendChild(b); syncers.push(() => b.classList.toggle('on', look[who].outfit === o)); }
    for (const [k, name] of FEATURES[who]) {
      const h = document.createElement('h3'); h.textContent = name; box.appendChild(h);
      const r = document.createElement('div'); r.className = 'btns'; box.appendChild(r);
      for (const c of L.SWATCHES[k]) { const b = document.createElement('button'); b.className = 'sw'; b.style.background = c; b.title = c; b.onclick = () => { look[who][k] = c; changed(who); }; r.appendChild(b); syncers.push(() => b.classList.toggle('on', look[who][k] === c)); }
      const pick = document.createElement('input'); pick.type = 'color'; pick.title = 'Any colour'; pick.onchange = () => { look[who][k] = pick.value; changed(who); }; r.appendChild(pick);
      syncers.push(() => { pick.value = look[who][k]; });
    }
  }
  for (const f of Object.keys(Toon.EXPRS)) {
    const b = document.createElement('button'); b.textContent = f; b.onclick = () => { face = f; rigs.red.setExpr(f); sync(); }; $('faces').appendChild(b); syncers.push(() => b.classList.toggle('on', face === f));
  }
  const sync = () => syncers.forEach(f => f());
  $('reset').onclick = () => { look = L.reset(); build('red'); build('gerda'); sync(); };
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => view(b.dataset.view, 700));
  $('spin').onclick = () => { spin = !spin; $('spin').classList.toggle('on', spin); if (!spin) turn.rotation.y = 0; };

  build('red'); build('gerda'); view('front'); sync();
  st.start(dt => { t += dt; if (spin) turn.rotation.y += dt * 0.5; Toon.idle(rigs.red, t); Toon.idle(rigs.gerda, t + 2.1); rigs.red.tick(dt); rigs.gerda.tick(dt); });
  window.__rigs = rigs;
})();
</script>
</body>
</html>

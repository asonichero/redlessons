<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6f4; font-family: Georgia, serif; }
  #view { position: fixed; inset: 0; }
  #bar { position: fixed; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  #bar button { font: 14px Georgia, serif; padding: 6px 12px; border-radius: 6px; border: 1px solid #8a6a4a; background: #fff8ee; color: #3a2a24; cursor: pointer; }
  #bar button.on { background: #cc2a2e; color: #fff; border-color: #8a1a1e; }
</style>
</head>
<body>
<div id="view"></div>
<div id="bar"><button data-m="stand" class="on">Stand</button><button data-m="walk">Walk</button><button data-m="run">Run</button><button data-m="circle">Walk in a circle</button><button id="cloak">Cloak</button><button id="small">55%</button></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/measures.js"></script>
<script src="js/toon.js"></script>
<script>
// The characters, posed and animated by js/toon.js. ?cast lines up the whole cast; otherwise the heroine alone, to watch her move.
// Stand / Walk / Run animate in place; Walk in a circle moves her round, so the cape and hair trail and settle.
(function () {
  const Q = new URLSearchParams(location.search), view = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.outputEncoding = THREE.sRGBEncoding; renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); view.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#cfe6f4').convertSRGBToLinear(); scene.fog = new THREE.Fog(scene.background, 160, 320);
  scene.add(new THREE.HemisphereLight(0xfff6e8, 0x8aa070, 0.55));
  const sun = new THREE.DirectionalLight(0xfff0d8, 0.95); sun.position.set(30, 60, 50); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(160, 48), Toon.toon('#8fbf6a')); ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const path = new THREE.Mesh(new THREE.CircleGeometry(46, 40), Toon.toon('#d8c49a')); path.rotation.x = -Math.PI / 2; path.position.y = 0.05; path.scale.set(1.6, 0.6, 1); scene.add(path);
  const people = [];
  const add = (id, x, z, ry, sc, cloak) => { const r = Toon.make(id); if (cloak && r.cloak) r.cloak.show(true); r.root.position.set(x, 0, z); r.root.rotation.y = ry; r.root.scale.setScalar(sc || 0.95); scene.add(r.root); const a = { t: Math.random() * 9, phase: 0, speed: 0 }; people.push({ r, a, x, z, ry, sc: sc || 0.95 }); return r; };
  const camera = new THREE.PerspectiveCamera(30, 1, 1, 800), controls = new THREE.OrbitControls(camera, renderer.domElement);
  if (Q.has('cast')) {
    [['heroine'], ['heroine', 0.55, true], ['mother'], ['grandmother'], ['miller'], ['woodcutter'], ['innkeeper']].forEach(([id, sc, cl], i) => add(id, -48 + i * 16, 0, 0, sc, cl));
    camera.position.set(0, 24, 150); controls.target.set(0, 14, 0);
  } else {
    add('heroine', 0, 0, 0.5, 0.95, Q.has('cloak') || true);
    camera.position.set(0, 22, 92); controls.target.set(0, 14, 0);
  }
  controls.update();
  let mode = Q.get('m') || 'stand', last = performance.now(), T = 0;
  window.__style = { people, camera, controls, set(m) { mode = m; }, step(dt) { tick(dt); }, render() { renderer.render(scene, camera); } };
  function tick(dt) {
    T += dt;
    for (const P of people) {
      const { r, a } = P, small = P.r.root.scale.x / 0.95; a.t += dt;
      const run = mode === 'run', moving = mode !== 'stand', speed = run ? 78 : 40, stride = (run ? 38 : 28) * 0.95 * small;
      a.speed = moving ? speed : 0; a.running = run;
      a.phase += dt * (moving ? speed * small : 0) / stride * Math.PI * 2;
      if (mode === 'circle') { const ang = T * speed * small / 40; r.root.position.set(P.x + Math.sin(ang) * 40, 0, P.z + Math.cos(ang) * 40 - 40); r.root.rotation.y = ang + Math.PI / 2; }
      else { r.root.position.set(P.x, 0, P.z); r.root.rotation.y = P.ry; }
      Toon.pose(r, a, dt); r.tick(dt);
    }
  }
  const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
  addEventListener('resize', resize); resize();
  (function loop(now) { const dt = Math.min(0.05, ((now || last) - last) / 1000); last = now || last; if (!window.__manual) tick(dt); controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; document.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b)); });
  document.getElementById('cloak').onclick = () => people.forEach(P => P.r.cloak && P.r.cloak.show(!P.r.cloak.group.visible));
  document.getElementById('small').onclick = () => people.forEach(P => { const s = P.r.root.scale.x > 0.7 ? 0.55 : 0.95; P.r.root.scale.setScalar(s); });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6f4; font-family: Georgia, serif; }
  #view { position: fixed; inset: 0; }
  .label { position: fixed; bottom: 18px; color: #3a2a24; font-size: 15px; text-align: center; width: 30%; text-shadow: 0 1px 0 #fff8; }
</style>
</head>
<body>
<div id="view"></div>
<div class="label" style="left:2%">Full height</div>
<div class="label" style="left:35%">The cloak on (still full height)</div>
<div class="label" style="left:68%">In the cloak, at 55%, beside the innkeeper</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/toon.js"></script>
<script>
(function () {
  const view = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.outputEncoding = THREE.sRGBEncoding; renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); view.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#cfe6f4').convertSRGBToLinear(); scene.fog = new THREE.Fog(scene.background, 160, 320);
  scene.add(new THREE.HemisphereLight(0xfff6e8, 0x8aa070, 0.55));
  const sun = new THREE.DirectionalLight(0xfff0d8, 0.95); sun.position.set(30, 60, 50); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(160, 48), Toon.toon('#8fbf6a')); ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const path = new THREE.Mesh(new THREE.CircleGeometry(46, 40), Toon.toon('#d8c49a')); path.rotation.x = -Math.PI / 2; path.position.y = 0.05; path.scale.set(1.6, 0.6, 1); scene.add(path);
  const a = Toon.make('heroine'); a.root.position.set(-26, 0, 0); a.root.rotation.y = 0.25; scene.add(a.root);
  const b = Toon.make('heroine'); b.cloak.show(true); b.root.position.set(0, 0, 0); b.root.rotation.y = 0.15; scene.add(b.root);
  const c = Toon.make('heroine'); c.cloak.show(true); c.root.position.set(21, 0, 4); c.root.rotation.y = -0.2; c.root.scale.setScalar(0.55); scene.add(c.root);
  const d = Toon.make('innkeeper'); d.root.position.set(31, 0, -2); d.root.rotation.y = -0.6; scene.add(d.root);
  const camera = new THREE.PerspectiveCamera(30, 1, 1, 800); camera.position.set(2, 26, 118);
  const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.target.set(2, 14, 0); controls.update();
  const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
  addEventListener('resize', resize); resize();
  (function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
  window.__style = { a, b, c, d, camera, controls };
})();
</script>
</body>
</html>

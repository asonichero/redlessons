<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Little Red’s Lessons</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a0f10">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1416; font-family: Georgia, 'Times New Roman', serif; color: #f3ead8; touch-action: none; }
  #view { position: fixed; inset: 0; }
  a { color: #c9a84c; }
  #endcard { position: fixed; inset: 0; z-index: 46; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(8,4,6,0.86); color: #f3e4b0; opacity: 0; transition: opacity 1.4s; }
  #endcard.on { opacity: 1; }
  #endcard .num { font-size: 14px; letter-spacing: .5em; text-transform: uppercase; color: #c9b87a; } #endcard i { width: 64px; height: 1px; background: #8a6a3a; }
  #endcard .name { font-size: clamp(28px, 6.4vw, 58px); letter-spacing: .05em; text-shadow: 0 3px 0 #5a1418; }
  #endcard nav { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
  #endcard button { font: 17px Georgia, serif; padding: 11px 22px; border-radius: 8px; border: 1px solid #6a5054; background: rgba(30,20,22,0.85); color: #f3ead8; cursor: pointer; }
  #endcard button:hover { border-color: #c9a84c; background: #4a3238; } #endcard button.primary { background: #7a2228; border-color: #c9a84c; }
  #card { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 40px)); background: #f6ecd8; color: #3a2a20; border: 3px solid #6b4a32; border-radius: 16px; padding: 18px 22px; font: 17px/1.5 Georgia, serif; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.45); z-index: 30; }
  #card .go, #card button { display: inline-block; margin: 6px; padding: 8px 18px; border-radius: 10px; border: 2px solid #6b4a32; background: #8a2a2a; color: #fff; font: 16px Georgia, serif; text-decoration: none; cursor: pointer; }
  #card button { background: #fffaf0; color: #3a2a20; }
  #fade { position: fixed; inset: 0; background: #0e0a0c; color: #f6ecd8; display: flex; align-items: center; justify-content: center; font: italic 26px Georgia, serif; opacity: 0; transition: opacity .9s; pointer-events: none; z-index: 40; }
  #fade.on { opacity: 1; pointer-events: auto; }
  /* The title: the name, the chapter, and a short menu down the left, as Consequence has it */
  #title { position: fixed; inset: 0; z-index: 45; display: flex; flex-direction: column; justify-content: center; padding: 0 max(28px, 8vw); box-sizing: border-box;
    background: radial-gradient(ellipse at 70% 40%, #4a2026 0%, #1e0e12 55%, #0e0709 100%); color: #f6ecd8; }
  #title h1 { margin: 0; font-size: clamp(34px, 6.4vw, 72px); font-weight: normal; letter-spacing: .05em; color: #f3e4b0; text-shadow: 0 3px 0 #5a1418, 0 0 40px rgba(0,0,0,.7); }
  #title h1 b { color: #e8504a; font-weight: normal; }
  #title h2 { margin: 6px 0 30px; font-size: clamp(15px, 2.2vw, 21px); font-weight: normal; font-style: italic; color: #e0c8b0; letter-spacing: .04em; }
  #title nav { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  #title nav button { min-width: 240px; text-align: left; font: 18px Georgia, serif; padding: 12px 20px; border-radius: 8px; border: 1px solid #6a5054; background: rgba(30,20,22,0.82); color: #f3ead8; cursor: pointer; }
  #title nav button:hover, #title nav button:focus-visible { background: #4a3238; border-color: #c9a84c; outline: none; }
  #title nav button.primary { background: #7a2228; border-color: #c9a84c; } #title nav button.primary:hover { background: #8e2a30; }
  #title nav button[hidden] { display: none; }
  #title nav button small { display: block; font-size: 12.5px; color: #d8bfa8; font-style: italic; margin-top: 2px; }
  #title .else { position: absolute; left: max(28px, 8vw); bottom: 22px; font-size: 13px; color: #b8a8a0; } #title .else a { margin-right: 14px; }
  #title .scenes { display: none; flex-direction: column; gap: 8px; margin-left: 18px; } #title .scenes.on { display: flex; }
  #title .scenes button { min-width: 200px; font-size: 16px; padding: 9px 16px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="fade"></div>
<div id="title"><h1>Little <b>Red</b>’s Lessons</h1><h2>Chapter One: The Red Cloak</h2>
  <nav><button id="cont" class="primary" hidden>Continue</button><button id="begin" class="primary">Begin</button>
    <button id="pick">Choose a scene</button><div class="scenes"><button data-at="cabin">Grandmother’s cabin</button><button data-at="wood">The wood</button><button data-at="home">Home</button></div>
    <button id="sets">Settings</button></nav>
  <div class="else"><a href="lap.html">Over the knee</a><a href="play.html">About the cottage</a><a href="editor.html">Character editor</a></div></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/toon.js"></script>
<script src="js/looks.js"></script>
<script src="js/cottage.js"></script>
<script src="js/cabin.js"></script>
<script src="js/wood.js"></script>
<script src="js/stage.js"></script>
<script src="js/motion.js"></script>
<script src="js/audio.js"></script>
<script src="js/talk.js"></script>
<script src="js/story.js"></script>
<script src="js/pain.js"></script>
<script src="js/lap.js"></script>
<script src="js/discipline.js"></script>
<script src="js/correction.js"></script>
<script src="js/play.js"></script>
<script src="js/save.js"></script>
<script src="js/calendar.js"></script>
<script src="js/reputation.js"></script>
<script src="js/questdata.js"></script>
<script src="js/quests.js"></script>
<script src="js/world.js"></script>
<script src="js/chapter1.js"></script>
<script src="js/hud.js"></script>
<script>
const $ = id => document.getElementById(id);
// The fade between places, with the name of the next.
const fade = (on, text) => new Promise(r => { if (on) $('fade').textContent = text || ''; $('fade').classList.toggle('on', on); setTimeout(r, on ? 950 : 50); });
// The end of the chapter: a card over the room (as Consequence closes its chapters), and on to the next morning.
const card = () => { hud.show(false); const c = document.createElement('div'); c.id = 'endcard';
  c.innerHTML = '<div class="num">The end of chapter one</div><i></i><div class="name">The Red Cloak</div><nav><button id="totitle">Back to the title</button><button id="goon" class="primary">The next morning</button></nav>';
  document.body.appendChild(c); requestAnimationFrame(() => c.classList.add('on'));
  $('goon').onclick = async () => { c.remove(); hud.show(true); await world.morning(); }; $('totitle').onclick = () => location.reload(); };
// The world (js/world.js), and the controls and menus (js/hud.js) for whichever place she's in.
const hud = Hud.create({ get: () => world.P, title: () => location.reload(), journal: () => world.journal(),
  links: [{ label: 'Over the knee', href: 'lap.html' }, { label: 'About the cottage', href: 'play.html' }, { label: 'Character editor', href: 'editor.html' }] });
hud.show(false);
const world = window.__ch = window.__world = World.create($('view'), { objective: t => hud.objective(t), clock: (t, ph) => hud.clock(t, ph), fade, card });
// Continue, if there's a game to take up again: where she was, and when.
const saved = world.save.exists() && world.save.state.area;
if (saved) { $('cont').hidden = false; $('cont').innerHTML = 'Continue<small>Day ' + world.cal.day + ', ' + world.cal.clock + ' · ' + world.AREAS[world.save.state.area].name + '</small>'; $('begin').classList.remove('primary'); $('begin').textContent = 'Begin again'; }
const start = f => { if (window.GameAudio) GameAudio.init(); $('title').remove(); hud.show(true); f(); };
$('begin').onclick = () => { if (saved && !confirm('Begin again, from the start? The game you have now will be lost.')) return; start(() => world.newGame()); };
$('cont').onclick = () => start(() => world.resume());
$('pick').onclick = () => $('title').querySelector('.scenes').classList.toggle('on');
document.querySelectorAll('[data-at]').forEach(a => a.onclick = () => start(() => a.dataset.at === 'cabin' ? world.newGame() : world.startAt(a.dataset.at)));
$('sets').onclick = () => hud.openSettings();
(saved ? $('cont') : $('begin')).focus();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>

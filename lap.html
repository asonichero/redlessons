<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Over the Knee</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a0f10">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1416; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; color: #e8e6e3; }
  #view { position: fixed; inset: 0 300px 0 0; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 300px; box-sizing: border-box; padding: 14px 16px; overflow-y: auto; background: rgba(22,18,20,0.97); border-left: 1px solid #3a2c30; font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 4px; } .sub { color: #9a8a8e; font-size: 11px; line-height: 1.5; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #a8969a; margin: 14px 0 6px; border-bottom: 1px solid #3a2c30; padding-bottom: 3px; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  button { background: #33282c; color: #e8e6e3; border: 1px solid #554449; border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: #43343a; } button:disabled { opacity: .4; cursor: default; }
  button.on { background: #6b2a2a; border-color: #e07070; color: #fff; }
  button.big { font-size: 14px; padding: 9px 16px; background: #4a3a1c; border-color: #c9a84c; }
  button.red { background: #8a1a22; border-color: #f08080; font-weight: bold; }
  input[type=range] { width: 100%; }
  #meter { position: relative; height: 14px; background: #1c1418; border: 1px solid #554449; border-radius: 4px; overflow: hidden; }
  #meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #4a7a4a, #c9a84c 60%, #c24850); }
  #meter b { position: absolute; top: 0; bottom: 0; left: 66.7%; width: 2px; background: #fff; opacity: .7; }
  #band { margin-top: 5px; } #info { margin-top: 6px; font-size: 12px; color: #b9a9ae; line-height: 1.5; }
  a { color: #c9a84c; }
  #line { position: fixed; left: 20px; right: 320px; bottom: 22px; text-align: center; font: 17px Georgia, serif; color: #fff; text-shadow: 0 1px 4px #000; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #line.on { opacity: 1; }
  @media (max-width: 700px) { #view { inset: 0 0 45% 0; } #panel { top: 55%; width: 100%; border-left: 0; border-top: 1px solid #3a2c30; } #line { right: 20px; bottom: 47%; } }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>Over the knee</h1>
  <div class="sub">Gerda seated, Red Riding Hood across her lap. Drag to orbit; the wheel zooms. Space smacks; R is Red. <a href="editor.html">Character editor</a></div>
  <h3>Correction</h3>
  <div class="btns" id="tiers"></div>
  <h3>Implement</h3><div class="btns"><button data-impl="hand" class="on">Hand</button><button data-impl="paddle">Paddle</button></div>
  <h3>Clothes</h3>
  <div class="btns"><button id="skirt">Skirt: down</button><button id="drawers">Drawers: up</button></div>
  <h3>Smacks</h3>
  <div class="btns"><button class="big" id="one">Smack</button><button class="big" id="ten">Run of 10</button></div>
  <div class="btns" style="margin-top:6px"><span>Pace</span><button data-pace="0.7">Slow</button><button data-pace="1" class="on">Steady</button><button data-pace="1.5">Brisk</button></div>
  <div class="btns" style="margin-top:6px"><span>Strength</span><button data-str="0.6">Light</button><button data-str="1" class="on">Firm</button><button data-str="1.3">Hard</button></div>
  <h3>Her distress</h3>
  <div id="meter"><i></i><b title="the edge of resistance"></b></div>
  <div id="band">composed</div>
  <div id="info"></div>
  <div class="btns" style="margin-top:10px"><button class="red" id="red">Red</button><button id="reset">Start again</button></div>
  <h3>Camera</h3><div class="btns"><button data-view="side">Side</button><button data-view="behind">Behind</button><button data-view="giver">Gerda’s view</button><button data-view="top">Above</button><button data-view="face">Her face</button></div>
</div>
<div id="line"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/toon.js"></script>
<script src="js/looks.js"></script>
<script src="js/cottage.js"></script>
<script src="js/stage.js"></script>
<script src="js/audio.js"></script>
<script src="js/pain.js"></script>
<script src="js/lap.js"></script>
<script src="js/discipline.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id), A = window.GameAudio, all = sel => document.querySelectorAll(sel);
  let lap = null, session = 0, lineTimer = 0;
  const st = { implement: 'hand', skirt: 'down', drawers: 'up', pace: 1, strength: 1 };
  const showLine = t => { $('line').textContent = 'Gerda: ' + t; $('line').classList.add('on'); clearTimeout(lineTimer); lineTimer = setTimeout(() => $('line').classList.remove('on'), 3200); };
  function build() {
    session++; $('line').classList.remove('on');
    if (lap) { lap.end(); lap.stop(); }
    $('view').innerHTML = ''; lap = Lap.create($('view'), { looks: Looks.load() });
    lap.set(Object.assign({}, st)); lap.view('side'); lap.start();
    lap.on((type) => { if (type === 'tooHarsh') $('info').textContent = 'Too harsh: nothing more is struck.'; if (type === 'red') $('info').textContent = 'Red. Everything stopped at once.'; });
    tiers(false);
  }
  // A scripted correction: the panel's own controls are held while it runs (Red and Start again stay live).
  const tiers = busy => { all('[data-tier], [data-impl], [data-pace], [data-str], #skirt, #drawers, #one, #ten').forEach(b => b.disabled = busy); if (!busy) label(); };
  for (const t of Discipline.TIERS) {
    const b = document.createElement('button'); b.textContent = Discipline.TIER_NAMES[t]; b.dataset.tier = t; b.title = Discipline.total(t) + ' smacks';
    b.onclick = async () => {
      wake(); build(); const me = session; tiers(true);
      const r = await Discipline.run(lap, t, { say: showLine });
      if (me !== session) return;
      Object.assign(st, { implement: lap.st.implement, skirt: lap.st.skirt, drawers: lap.st.drawers });
      all('[data-impl]').forEach(x => x.classList.toggle('on', x.dataset.impl === st.implement));
      $('info').textContent = (r.red ? 'Red. ' : r.tooHarsh ? 'Too harsh. ' : Discipline.TIER_NAMES[t] + ', done. ') + r.hits + ' smacks.';
      tiers(false); all('#one, #ten').forEach(x => x.disabled = true);
    };
    $('tiers').appendChild(b);
  }
  all('[data-impl]').forEach(b => b.onclick = () => { st.implement = b.dataset.impl; all('[data-impl]').forEach(x => x.classList.toggle('on', x === b)); lap.set({ implement: st.implement }); });
  all('[data-pace]').forEach(b => b.onclick = () => { st.pace = +b.dataset.pace; all('[data-pace]').forEach(x => x.classList.toggle('on', x === b)); lap.set({ pace: st.pace }); });
  all('[data-str]').forEach(b => b.onclick = () => { st.strength = +b.dataset.str; all('[data-str]').forEach(x => x.classList.toggle('on', x === b)); lap.set({ strength: st.strength }); });
  all('[data-view]').forEach(b => b.onclick = () => lap.view(b.dataset.view, 700));
  $('skirt').onclick = () => { st.skirt = st.skirt === 'down' ? 'up' : 'down'; if (st.skirt === 'down') st.drawers = 'up'; lap.set({ skirt: st.skirt, drawers: st.drawers }); label(); };
  $('drawers').onclick = () => { if (st.skirt === 'down') return; st.drawers = st.drawers === 'up' ? 'down' : 'up'; lap.set({ drawers: st.drawers }); label(); };
  function label() { $('skirt').textContent = 'Skirt: ' + (st.skirt === 'down' ? 'down' : 'lifted'); $('drawers').textContent = 'Drawers: ' + st.drawers; $('drawers').disabled = st.skirt === 'down'; }
  const wake = () => { if (A) A.init(); };
  $('one').onclick = () => { wake(); lap.smack(); }; $('ten').onclick = () => { wake(); lap.run(10); };
  const red = () => { lap.red(); }; $('red').onclick = red;
  $('reset').onclick = () => { $('info').textContent = ''; Object.assign(st, { skirt: 'down', drawers: 'up' }); build(); };
  addEventListener('keydown', e => {
    if (e.key === ' ' && !$('one').disabled) { e.preventDefault(); wake(); lap.smack(); }
    if (e.key === 'r' || e.key === 'R') red();
  });
  setInterval(() => { if (!lap) return; const d = lap.pain.distress(); $('meter').firstElementChild.style.width = Math.min(100, d / 1.5 * 100) + '%'; $('band').textContent = lap.band(); const t = $('info').textContent; if (!/^(Red|Too|Token|Light|Firm|Severe)/.test(t)) $('info').textContent = lap.st.hits + ' smacks'; }, 120);
  build(); label(); window.__lap = () => lap;
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
